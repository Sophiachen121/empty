<text x="445.0" y="415.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#1565C0" font-weight="normal" font-style="normal">blue = amine nitrogen (becomes the amide N);</text>
<text x="735.0" y="415.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#2E7D32" font-weight="normal" font-style="normal">green = N–H hydrogen that ends up on acetic acid.</text></svg>